name: GeffenWeverse Creator Studio validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/geffen-admin-panel]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript and Creator Studio integration
        run: node tests/validate-creator-studio.mjs
