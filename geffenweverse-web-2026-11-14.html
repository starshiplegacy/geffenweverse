<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeffenWeverse</title>
<style>
/* ===== 1. VARIABLES Y BASE ===== */
:root{--bg:#000;--card:#161616;--line:#2c2c2c;--tx:#fff;--mu:#8a8a8a;--ac:#22d3ee;--brand:#00c4cc;color-scheme:dark}
[data-theme=light]{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--tx:#0b0b0b;--mu:#6b7280;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.wrap{max-width:900px;margin:0 auto;padding:8px 8px 90px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}.row .t{flex:1}.row .t b{display:block;font-weight:600}
.row small,.mu{display:block;color:var(--mu);font-size:11.5px;margin-top:3px}
.chev{width:14px;height:14px;color:var(--mu)}

/* ===== 2. INICIO ===== */
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:13px;background:linear-gradient(90deg,#60a5fa,#c084fc,#f472b6,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .ic{display:flex;gap:14px}.hd .i{width:16px;height:16px}
.tabs{display:flex;gap:10px;padding:12px;font-size:12px;font-weight:600;overflow-x:auto}
.tabs a:nth-child(1){background:#052e16;color:#22c55e;border:1px solid #166534;border-radius:5px;padding:1px 7px;font-size:10px}
.tabs a:nth-child(2){color:#60a5fa}.tabs a:nth-child(3){color:#c084fc}.tabs a:nth-child(4){color:#fb923c}.tabs a:nth-child(5){color:#f472b6}
.feat{display:flex;align-items:center;gap:6px;padding:4px 12px 10px}
.feat small{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;width:100%;display:block;margin:0 0 6px}
.av{width:34px;height:34px;border-radius:50%;border:2px solid #fff;flex:none}
.g1{background:linear-gradient(135deg,#fecaca,#f472b6 60%,#881337)}.g2{background:linear-gradient(135deg,#cbd5e1,#475569 60%,#0f172a)}.g3{background:linear-gradient(135deg,#fda4af,#be123c 60%,#3b0764)}
.feed .top{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:8px;font-weight:700;background:#1f1f23;color:#e5e5e5;border:1px solid #3a3a40;border-radius:99px;padding:2px 8px}
.yel{color:#facc15;font-size:9px;margin:6px 0}
.photo{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#ffffff2e,transparent 40%),linear-gradient(#2b2f38,#0a0a0c)}
.photo i{position:absolute;bottom:30%;width:9%;height:26%;border-radius:40% 40% 10% 10%;background:linear-gradient(#3b3b42,#0d0d10)}
.photo i::before{content:"";position:absolute;top:-34%;left:18%;width:64%;height:38%;border-radius:50%;background:#c7a98f}
.photo u{position:absolute;left:6%;right:6%;bottom:12%;height:24%;background:#0a0a0c;border-radius:6px}
.chip{position:absolute;left:8px;bottom:8px;background:#3c3c42d9;border-radius:99px;padding:3px 8px;font-size:8px;font-weight:700;color:#fff}
.bm{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#282830d9;display:grid;place-items:center;color:#fff}
.bm .i{width:11px;height:11px}
.acts{display:flex;justify-content:space-between;margin-top:8px;font-size:9px;color:#60a5fa}
.vids{display:flex;gap:8px}.vids div{position:relative;flex:1;aspect-ratio:3/4.6;border-radius:12px}
.vids div:nth-child(1){background:radial-gradient(circle at 50% 28%,#e9d5ff,transparent 25%),linear-gradient(#3b2a5c,#1e3a8a 55%,#0b1224)}
.vids div:nth-child(2){background:radial-gradient(circle at 50% 35%,#e5e5e5,transparent 22%),linear-gradient(#555,#8a7f72 55%,#1c1c1c)}
.vids div:nth-child(3){background:radial-gradient(circle at 50% 30%,#d4d4d8,transparent 22%),linear-gradient(#4b4b52,#1f2937 55%,#050505)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:900px;display:flex;justify-content:space-around;align-items:center;
 background:var(--bg);border-top:1px solid var(--line);padding:9px 0 calc(9px + env(safe-area-inset-bottom,0px));z-index:5}
.nav a{color:var(--mu)}.nav a.on{color:#22c55e}
.nav .mid{border:1px solid #52525b;border-radius:50%;padding:6px;margin-top:-16px;background:var(--bg);color:var(--tx)}
.home-wrap{min-height:100vh;display:flex;flex-direction:column;padding-bottom:90px}
.home-empty{flex:1;padding:18px 12px}
.welcome-notice{display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.welcome-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#22d3ee20;color:var(--ac);flex:none}
.welcome-notice b{display:block;font-size:13px}
.welcome-notice p{margin-top:5px;color:var(--mu);font-size:12px;line-height:1.5}

/* ===== 3. MI PERFIL + MENÚ ===== */
.cover{height:130px;background:#8fa5b1;margin:0 4px}
.ph{position:relative;height:56px;margin:0 4px}
.avl{position:absolute;left:8px;top:-54px;width:104px;height:104px;border-radius:50%;background:#435470;border:4px solid var(--bg)}
.edit{position:absolute;right:6px;top:8px;border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}
.info{padding:0 14px 12px}.nm{display:flex;align-items:center;gap:5px;font-size:22px;font-weight:800}
.ok{width:18px;height:18px;fill:var(--ac);stroke:none}
.meta{display:flex;gap:14px;color:var(--mu);font-size:13px;margin:8px 0}.meta span{display:flex;gap:4px;align-items:center}.meta .i{width:15px;height:15px}
.cnt{display:flex;gap:18px;color:var(--mu)}.cnt b{color:var(--tx)}
.ptabs{display:flex;justify-content:space-between;border-bottom:2px solid var(--line);margin:0 4px 0;padding:0 8px}
.ptabs span{padding:10px 8px 8px;color:var(--mu);margin-bottom:-2px;border-bottom:3px solid transparent}
.ptabs .on{color:var(--tx);font-weight:700;border-color:var(--ac)}
.post{display:flex;gap:10px;padding:14px 8px;margin:0 4px 14px;border-bottom:2px solid var(--line)}
.post .av{width:42px;height:42px;border:0;background:#435470}
.post .h{display:flex;align-items:center;gap:4px;color:var(--mu)}.post .h strong{color:var(--tx);font-size:15px}
.post p{margin:4px 0 10px;line-height:1.3}.post .a{display:flex;justify-content:space-between;color:var(--mu);padding-right:8px}.post .a span{display:flex;gap:6px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;align-items:start}
.ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff}.ico .i{width:13px;height:13px}
.ico.g{background:#5a5a5a}

/* ===== 4. CONFIGURACIÓN ===== */
.bar{display:flex;align-items:center;gap:16px;padding:14px 8px}.bar h1{font-size:22px;font-weight:800}
.mbtn{margin-left:auto;padding:8px;display:grid;place-items:center}.mbtn .i{width:24px;height:24px}
.off{opacity:.4;cursor:not-allowed}
.cnt a:hover{text-decoration:underline}
.inp{display:block;width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--tx);font:inherit;margin-top:10px}.btn2{background:var(--ac);color:#000;font-weight:700;border-radius:99px;padding:10px 20px;margin-top:12px}
.cart{position:relative;display:grid;place-items:center;padding:4px;margin-right:10px}.cart .i{width:20px;height:20px}
.cart::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);background:#111;border:1px solid #333;color:#fff;font-size:10px;font-weight:700;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:6}.cart:hover::after,.cart:focus-visible::after{opacity:1}
.stabs{display:flex;gap:6px;background:#fff;border-top:1px solid #eceef1;border-bottom:1px solid #e5e7eb;padding:0 14px}
.stabs a{padding:12px 14px 10px;font-weight:600;color:#6b7280;border-bottom:3px solid transparent;margin-bottom:-1px}.stabs a.on{color:#000;font-weight:800;border-color:#2563eb}
.sw.lp{background:#2563eb}.sw.lp[aria-checked=true]{background:#22c55e}
.radio{display:grid;place-items:center}.radio.on{color:#22c55e}.radio.off{color:#3b82f6}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 14px}.sbox .i{width:16px;height:16px;color:var(--mu)}
.sbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px}.chip2{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;color:var(--mu);white-space:nowrap}.chip2.on{background:var(--ac);color:#000;border-color:var(--ac)}
.bell{position:relative;display:grid;place-items:center}.dot{position:absolute;top:-7px;right:-9px;background:#ef4444;color:#fff;font-size:8px;font-weight:800;min-width:14px;height:14px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.nb{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;color:#000;display:grid;place-items:center;border:2px solid var(--card)}.nb .i{width:11px;height:11px}
.ud{width:9px;height:9px;border-radius:50%;background:#3b82f6;flex:none}
.lt .card{background:#fff;border:1px solid #e5e7eb}
.lupa{width:40px;height:40px;border-radius:50%;border:1px solid #dcdfe4;background:#fff;display:grid;place-items:center;flex:none}.lupa .i{width:18px;height:18px}
.sbox2{display:none;align-items:center;gap:8px;background:#fff;border:1px solid #dcdfe4;border-radius:99px;padding:10px 14px;margin-top:14px}.sbox2.on{display:flex}
.sbox2 input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:#000}.sbox2 .i{width:16px;height:16px;color:#6b7280}
.fila{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid #dcdfe4;background:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:12px;color:#000}.tb .i{width:14px;height:14px}.tb.pay{background:#2563eb;border-color:#2563eb;color:#fff}
.lt .pill{background:#f3f4f6;color:#111;border-color:#e5e7eb}.lt .usr input{width:18px;height:18px;flex:none}
.heart{width:34px;height:34px;border-radius:50%;border:1px solid #dcdfe4;display:grid;place-items:center;flex:none;color:#6b7280}.heart.on{color:#ef4444}.heart.on .i{fill:#ef4444}
#modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:30;padding:20px}
.mbox{background:#fff;color:#000;border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;font-size:15px}.mbox div{display:flex;gap:10px;justify-content:center;margin-top:8px}
.btn3{border:1px solid #dcdfe4;border-radius:99px;padding:10px 26px;font-weight:700;margin-top:12px}
.sbtn{width:22px;height:22px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;line-height:1}
.shorts{height:calc(100dvh - 64px - env(safe-area-inset-top,0px));max-width:480px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.shorts::-webkit-scrollbar{display:none}
.short{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 12px 20px;color:#fff;overflow:hidden}
.short .tit{position:absolute;top:12px;left:14px;font-weight:800;font-size:15px;text-shadow:0 1px 4px #0008}
.short .info{flex:1;min-width:0;padding-right:12px;text-shadow:0 1px 4px #0009}.short .rail{display:flex;flex-direction:column;gap:16px;align-items:center}
.rb2{display:grid;place-items:center;gap:2px;font-size:11px;font-weight:700;color:#fff}.rb2 .i{width:30px;height:30px;filter:drop-shadow(0 1px 3px #0008)}.rb2.on .i{fill:#facc15;stroke:#facc15}
.bar>a:first-child{padding:8px;margin:-8px 0 -8px -8px;display:grid;place-items:center}.bar>a:first-child .i{width:22px;height:22px}
.bk{display:flex;width:max-content;padding:8px;margin:-26px 0 12px -10px;color:#000}
.ptabs a{flex:1;text-align:center;padding:10px 8px 8px;color:var(--mu);margin-bottom:-2px;border-bottom:3px solid transparent;font-weight:600}.ptabs a.on{color:var(--tx);border-color:var(--ac);font-weight:700}
.usr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.usr:last-child{border-bottom:0}
.usr .av{width:46px;height:46px;border:0}.usr b{display:block;font-size:14px}.usr .mu{font-size:12.5px;margin-top:2px}
a.usr:hover{background:#ffffff0a}.faq details{border-bottom:1px solid var(--line);padding:14px 0}.faq details:last-child{border-bottom:0}.faq summary{font-weight:600;cursor:pointer}.faq p.r{margin-top:8px;color:var(--mu);line-height:1.4}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"›";font-size:20px;color:var(--mu);transform:rotate(90deg);transition:transform .15s}.faq details[open] summary::after{transform:rotate(-90deg)}
.faq a{color:var(--ac);text-decoration:underline;word-break:break-all}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;padding-right:20px;font-size:12px;font-weight:600;min-width:110px;text-align:right}
.sel select option{background:#222;color:#fff}.sel .i{position:absolute;right:0;width:14px;height:14px;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:#3a3a3a;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw[aria-checked=true]{background:var(--ac)}.sw[aria-checked=true]::after{transform:translateX(18px)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #3a3a3a;display:grid;place-items:center;flex:none}
.rd::after{content:"";width:7px;height:7px;border-radius:50%;background:#3a3a3a}
[aria-checked=true]>.rd{background:var(--ac);border-color:var(--ac)}[aria-checked=true]>.rd::after{background:#000}
[aria-checked=true]>.t>b{color:var(--ac)}

/* ===== 5. TIENDA Y LOGIN (páginas claras) ===== */
.lt{--tx:#0b0b0b;--mu:#6b7280;--line:#e5e7eb;background:#f6f7f9;color:#0b0b0b;min-height:100vh}
.sbar{background:#fff;min-height:47px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 14px;font-size:13px;font-weight:500}
.sbar>div{display:flex;align-items:center}.sbar a,.sbar button{padding:0 12px;border-left:1px solid #e5e7eb}
.sbar a:first-child,.sbar .l{border:0;padding-left:0}
.lg{font-weight:800;font-size:16px;margin-right:14px}.lg i{color:var(--brand)}.dd::after{content:" ▾";font-size:10px}
.shop{max-width:1080px;margin:0 auto;padding:52px 24px 90px}.shop h1{font-size:26px;font-weight:800}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px;color:#6b7280}
.empty .i{width:52px;height:52px;color:#b0b3b8;margin-bottom:16px;stroke-width:1.6}
.ord{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between}
.up{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:#2563eb;display:grid;place-items:center}
.up path:first-child{stroke:#000}.up path:last-child{stroke:#fff}
.lcard{max-width:675px;margin:16px auto;background:#fff;border-radius:24px;box-shadow:0 8px 32px #0000001a;padding:48px 44px 40px}
.lcard .lg{font-size:20px;display:block;margin-bottom:34px}.lg2{display:grid;grid-template-columns:1fr 270px;gap:30px}
.lcard h1{font-size:24px;line-height:1.3;font-weight:800}
.rt{display:flex;flex-direction:column;align-items:center}
.pb{position:relative;width:100%;height:44px;border:1px solid #dcdfe4;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:12px}
.pb:hover,.rb:hover{background:#fafafa}
.pb em{position:absolute;top:-9px;right:16px;background:#5b8def;color:#fff;font:800 8px sans-serif;padding:4px 8px;border-radius:99px}
.soc{display:flex;gap:12px;margin-top:6px}.rb{width:44px;height:44px;border:1px solid #dcdfe4;border-radius:50%;background:#fff;display:grid;place-items:center}
.sw2{margin-top:64px;text-align:center;color:#8a8f98}.sw2 a{color:#000;text-decoration:underline}
.foot{max-width:1100px;margin:30px auto 0;border-top:1px solid #eceef1;padding:36px 14px 24px;display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:space-between;align-items:center}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 18px}.foot .sel{border:1px solid #dcdfe4;border-radius:8px;padding:8px 12px;background:#fff}
.foot .sel select{text-align:left;min-width:120px;color:#000}.foot .sel .i{right:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:10px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media(max-width:640px){.cols,.lg2{grid-template-columns:1fr}.lcard{padding:30px 20px}.sw2{margin-top:30px}.shop{padding-top:30px}}
.auth-form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth-form label{display:block;font-size:12px;font-weight:700;color:#374151}
.auth-form input{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#111;font:inherit}
.auth-submit{width:100%;border:0;border-radius:99px;padding:13px 18px;background:#111827;color:#fff;font-weight:800;margin-top:4px}
.auth-link{display:inline-block;color:#111;text-decoration:underline;font-weight:700;margin-top:14px}
.auth-note{font-size:12px;line-height:1.5;color:#6b7280;margin-top:12px}
.auth-loading{max-width:420px;margin:80px auto;text-align:center;padding:30px;color:var(--mu)}

/* ===== GEFFEN ACCOUNT: diseño original recuperado ===== */
.ga-welcome{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.ga-page{background:#f5f6f8;color:#14181d;min-height:100vh;display:flex;flex-direction:column;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
.ga-main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.ga-card{width:100%;max-width:680px;background:#fff;border-radius:18px;box-shadow:0 6px 28px rgba(20,24,29,.09);padding:44px 48px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.ga-brand{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-bottom:34px}
.ga-brand .ga-mark{color:#00c3d0}.ga-brand .ga-rest{color:#14181d}
.ga-headline{font-size:24px;line-height:1.32;font-weight:700;letter-spacing:-.3px}
.ga-actions{display:flex;flex-direction:column;gap:12px}
.ga-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;padding:0 18px;border:1px solid #dfe3e8;border-radius:999px;background:#fff;color:#14181d;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.ga-btn:hover{background:#f7f9fb;border-color:#c9d0d8}.ga-btn:active,.ga-primary:active{transform:scale(.99)}

.ga-card-foot{grid-column:1/-1;text-align:center;font-size:13px;color:#6b7683;padding-top:8px}

.ga-form{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}

.ga-field input:focus{outline:none;border-color:#1a5fb4;background:#fff;box-shadow:0 0 0 3px rgba(26,95,180,.12)}
.ga-gender{border:0;padding:0;min-width:0}

.ga-gender-emoji{font-size:20px;line-height:1.2}
.ga-primary{width:100%;min-height:48px;margin-top:8px;border:0;border-radius:999px;background:#1a5fb4;color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
.ga-primary:hover{background:#154e94}.ga-primary:disabled{opacity:.65;cursor:wait}
.ga-back{display:block;margin:16px auto 0;background:none;border:0;font-family:inherit;font-size:13px;font-weight:700;color:#6b7683;cursor:pointer;text-decoration:underline}
.ga-link{display:inline-block;color:#14181d;text-decoration:underline;font-weight:700;margin-top:14px;font-size:13px}
.ga-note{font-size:12px;line-height:1.5;color:#6b7683;margin-top:12px}
.ga-alert{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;background:#edf7ee;color:#256b2c;border:1px solid #c6e6c9}
.ga-footer{border-top:1px solid #dfe3e8;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#6b7683}
.ga-footer nav{display:flex;gap:20px;flex-wrap:wrap}
.ga-footer nav a{color:#6b7683;text-decoration:none;font-weight:600}
.ga-footer nav a:hover{color:#14181d;text-decoration:underline}

@media(max-width:640px){.ga-card{grid-template-columns:1fr;gap:26px;padding:30px 22px 26px;border-radius:14px}.ga-brand{margin-bottom:20px}.ga-headline{font-size:20px}.ga-form{grid-template-columns:1fr;gap:18px}.ga-welcome{grid-template-columns:1fr;gap:26px}.ga-footer{justify-content:center;text-align:center}.ga-footer nav{justify-content:center;gap:12px 18px}}

.radio-wrap{position:relative;display:flex;align-items:center}

.radio-panel[hidden],.radio-volume[hidden]{display:none}

.radio-actions{display:flex;align-items:center;justify-content:space-around;gap:8px}

.radio-volume{padding-top:10px}
.radio-volume input{width:100%;accent-color:var(--ac)}
.radio-source{font-size:9px;color:var(--mu);margin-top:8px}

function applyTheme(mode) {
  const light = mode === 'light' || (mode === 'device' && mq.matches);

}

    } catch(error) { authReady=true; console.error('Error inicializando Supabase Auth:',error); toast(this.mensajeError(error)); render(); }
  },
  async login(form) {
    const email=form.email.value.trim(),password=form.password.value;
    if(!email||!password) return toast('Escribe tu correo y contraseña.');
    const submit=form.querySelector('[type=submit]'); submit.disabled=true; submit.textContent='Iniciando sesión…';
    try { const {error}=await supabaseClient.auth.signInWithPassword({email,password}); if(error) throw error; }
    catch(error){toast(this.mensajeError(error));}
    finally{submit.disabled=false;submit.textContent='Iniciar sesión';}
  },
  async register(form) {
    const displayName=form.display_name.value.trim(),email=form.email.value.trim(),password=form.password.value,confirm=form.confirm_password.value;
    const gender=form.elements.namedItem('gender')?.value;
    if(!displayName||!email||!password||!gender) return toast('Completa todos los campos y selecciona tu género.');
    if(password.length<8) return toast('La contraseña debe tener al menos 8 caracteres.');
    if(password!==confirm) return toast('Las contraseñas no coinciden.');
    const submit=form.querySelector('[type=submit]'); submit.disabled=true; submit.textContent='Creando cuenta…';
    try {
      const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:displayName,gender},emailRedirectTo:this.redirectUrl()}});
      if(error) throw error;
      if(data.session) await this.sync(data.session,'SIGNED_IN');
      else { toast('Cuenta creada. Revisa tu correo y confirma la dirección antes de iniciar sesión.'); location.hash='#login'; }
    } catch(error){toast(this.mensajeError(error));}
    finally{submit.disabled=false;submit.textContent='Crear cuenta';}
  },
  async recover(form) {
    const email=form.email.value.trim(); if(!email) return toast('Escribe el correo asociado a tu cuenta.');
    const submit=form.querySelector('[type=submit]'); submit.disabled=true; submit.textContent='Enviando…';
    try { const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:this.redirectUrl()}); if(error) throw error; toast('Si existe una cuenta con ese correo, recibirás instrucciones para recuperar el acceso.'); location.hash='#login'; }
    catch(error){toast(this.mensajeError(error));}
    finally{submit.disabled=false;submit.textContent='Enviar instrucciones';}
  },
  async updatePassword(form) {
    const password=form.password.value,confirm=form.confirm_password.value;
    if(password.length<8) return toast('La contraseña debe tener al menos 8 caracteres.');
    if(password!==confirm) return toast('Las contraseñas no coinciden.');

    try { const {error}=await supabaseClient.auth.updateUser({password}); if(error) throw error; toast('Contraseña actualizada correctamente.'); location.hash='#inicio'; }
    catch(error){toast(this.mensajeError(error));}
    finally{submit.disabled=false;submit.textContent='Guardar contraseña';}
  },
  async signOut(){const {error}=await supabaseClient.auth.signOut({scope:'local'});if(error)toast(this.mensajeError(error));}

/* GEFFEN RADIO: emisoras internacionales K-pop, pop y pop latino. Audio directo desde cada emisora. */
const radioOn = () => store.get('gw-radio') !== 'false';
const radioAudio = new Audio();
radioAudio.preload = 'none';
radioAudio.volume = 0.35;
let radioStations = [], radioIndex = -1, radioLoading = false, radioLoaded = false;
const radioTags = ['k-pop', 'pop', 'latin pop'];
const radioLabel = s => [s?.name, s?.country].filter(Boolean).join(' · ') || 'GEFFEN RADIO';
function radioStatus(message) {
  document.querySelectorAll('[data-radio-station]').forEach(el => el.textContent = message);
}
function radioShuffle(items) {
  const a = [...items];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
async function radioLoadCatalog() {
  if (!radioOn() || radioLoaded || radioLoading) return;
  radioLoading = true;
  radioStatus('Buscando emisoras internacionales…');
  try {
    const results = await Promise.all(radioTags.map(async tag => {
      const url = 'https://spinnradio.com/api/stations?tag='+encodeURIComponent(tag)+'&limit=35&order=clickcount&reverse=true&hidebroken=true';
      const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!response.ok) throw new Error('No se pudo consultar el catálogo de radio.');
      const data = await response.json();
      return Array.isArray(data) ? data : (data.stations || data.items || []);
    }));
    const unique = new Map();
    results.flat().forEach(station => {
      const stream = station.url_resolved || station.url;
      const id = station.stationuuid || station.id;
      if (!id || !stream || !/^https:\/\//i.test(stream)) return;
      if (!unique.has(id)) unique.set(id, { id, name: station.name || 'Emisora internacional', country: station.country || '', stream, tags: station.tags || '', homepage: station.homepage || '' });
    });
    radioStations = radioShuffle([...unique.values()]);
    radioLoaded = true;
    if (!radioStations.length) throw new Error('No encontramos streams HTTPS compatibles.');
    radioIndex = 0;
    radioSetStation(radioIndex, true);
  } catch (error) {
    console.error('GEFFEN RADIO:', error);
    radioStatus('No se pudo cargar la radio. Inténtalo de nuevo más tarde.');
  } finally { radioLoading = false; }
}
function radioSetStation(index, autoplay=true) {
  if (!radioStations.length || !radioOn()) return;
  radioIndex = (index + radioStations.length) % radioStations.length;
  const station = radioStations[radioIndex];
  radioAudio.pause();
  radioAudio.src = station.stream;
  radioAudio.load();
  radioStatus('GEFFEN RADIO · '+radioLabel(station));
  if (autoplay) {
    const attempt = radioAudio.play();
    if (attempt && attempt.catch) attempt.catch(() => radioStatus('GEFFEN RADIO · Toca la pantalla para iniciar · '+radioLabel(station)));
  }
}
function radioStep(direction) {
  if (!radioOn()) { radioStatus('Activa GEFFEN RADIO desde Ajustes.'); return; }
  if (!radioLoaded) { radioLoadCatalog(); return; }
  radioSetStation(radioIndex + direction, true);
}
function radioEnable() {
  if (radioOn()) radioLoadCatalog();
  else { radioAudio.pause(); radioAudio.removeAttribute('src'); radioAudio.load(); radioStatus('GEFFEN RADIO desactivada desde Ajustes.'); }
}
radioAudio.addEventListener('error', () => radioStatus('Esta emisora no está disponible. Prueba con ⏭️.'));
radioAudio.addEventListener('playing', () => radioStatus('EN VIVO · '+radioLabel(radioStations[radioIndex])));
radioAudio.addEventListener('pause', () => { if (radioOn() && radioStations[radioIndex]) radioStatus('EN PAUSA · '+radioLabel(radioStations[radioIndex])); });
/* El navegador puede bloquear el autoplay audible; el primer gesto del usuario lo desbloquea. */
document.addEventListener('pointerdown', () => {
  if (!radioOn() || !radioAudio.src || !radioAudio.paused) return;
  const p = radioAudio.play(); if (p && p.catch) p.catch(() => {});
}, true);

}

/* Lista de personas: foto a la izquierda; nombre y @id apilados a la derecha */
function personas(tipo) {
  const sig = tipo === 'siguiendo';
  const datos = sig ? listaSiguiendo : listaSeguidores;
  const fotos = ['g1', 'g2', 'g3'];
  return `<div class="wrap"><header class="bar"><a href="#perfil" data-back aria-label="Volver">${I('back')}</a>
    <h1>${sig ? 'Siguiendo' : 'Seguidores'}<span class="mu" style="font-weight:400;font-size:12px;margin:2px 0 0">${sig ? 'A los que sigues' : 'Los que te siguen'}</span></h1></header>
    <div class="ptabs"><a href="#siguiendo" data-replace class="${sig ? 'on' : ''}">Siguiendo</a><a href="#seguidores" data-replace class="${sig ? '' : 'on'}">Seguidores</a></div>
    <section class="card" style="margin-top:12px">${datos.length
      ? datos.map((u, i) => `<div class="usr"><span class="av ${fotos[i % 3]}"></span><div><b>${u.nombre}</b><span class="mu">@${u.id}</span></div></div>`).join('')
      : `<p class="mu" style="text-align:center;padding:24px 0">${sig ? 'Aún no sigues a nadie' : 'Aún no tienes seguidores'}</p>`}</section></div>`;
}

/* WikiGeffen: enciclopedia de cada artista de Starship Legacy (secciones listas para llenar) */
function wiki(slug) {
  const a = artistas.find(x => x.slug === slug);
  if (!a) return pages.artistas();
  const i = artistas.indexOf(a);
  return `<div class="wrap"><header class="bar"><a href="#artistas" data-back aria-label="Volver">${I('back')}</a><h1>WikiGeffen<span class="mu" style="font-weight:400;font-size:12px;margin:2px 0 0">Enciclopedia de artistas de Starship Legacy</span></h1></header>
    <section class="card" style="text-align:center"><span class="av g${i % 3 + 1}" style="display:block;width:96px;height:96px;margin:6px auto 12px"></span><h2 style="font-size:22px;margin:0 0 8px">${a.nombre}</h2><span class="pill">${a.tipo}</span></section>
    ${['Resumen', 'Datos básicos', 'Trayectoria', 'Discografía', 'Galería'].map(s => `<section class="card"><h2>${s}</h2><p class="mu" style="margin:0">Todavía no hay contenido en esta sección.</p></section>`).join('')}</div>`;
}

    <div><div class="ga-brand"><span class="ga-mark">geffen</span> <span class="ga-rest">account</span></div><h1 class="ga-headline">¡Disfruta todos los servicios de Geverse con un solo registro!</h1></div>
    <div class="ga-actions">
      <button class="ga-btn" type="button" data-ga-view="email"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>Continuar con email</button>
      <button class="ga-btn" type="button" data-ga-route="registro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6"/></svg>Registro de cuenta</button>
    </div>
    <div class="ga-card-foot">¿Es tu primera vez en Geffen? <a href="#registro">Registro de cuenta</a></div>
  </section>`: '';
  const isWelcome=login;
  const left=(reg||recovery||reset)?`<div><div class="ga-brand"><span class="ga-mark">geffen</span> <span class="ga-rest">account</span></div><h1 class="ga-headline">${title}</h1><p class="ga-sub" style="margin-top:12px">${intro}</p></div>`:`<div><div class="ga-brand"><span class="ga-mark">geffen</span> <span class="ga-rest">account</span></div><h1 class="ga-headline">${title}</h1><p class="ga-sub" style="margin-top:12px">${intro}</p></div>`;
  const formSection=`<section class="ga-form" id="ga-form" ${isWelcome?'hidden':''}>
    ${left}
    <div>${form}${back}</div>
  </section>`;
  const footer=`<footer class="ga-footer"><nav><a href="#login">Términos y condiciones</a><a href="#login" style="color:#14181d;font-weight:700">Política de privacidad</a><a href="#login">Política de cookies</a><a href="#login">Anuncios</a></nav><span class="ga-language">◎ &nbsp; Español (latino) &nbsp;⌄</span></footer>`;
  return `<div class="ga-page"><main class="ga-main"><div class="ga-card">${welcome}${formSection}</div></main>${footer}</div>`;
}
/* ===== 9. ROUTER ===== */
function render() {
  const r = location.hash.slice(1) || 'inicio';
  if (!authReady) { $('#app').innerHTML = '<div class="auth-loading">Conectando de forma segura con GeffenWeverse…</div>'; return; }
  const publicRoutes = ['login', 'registro', 'recuperar'];
  if (!currentUser && !publicRoutes.includes(r)) { if (r !== 'login') location.hash = '#login'; else $('#app').innerHTML = pages.login(); return; }
  if (currentUser && ['login', 'registro', 'recuperar'].includes(r)) { location.hash = '#inicio'; return; }
  const page = pages[r] || (r.startsWith('wiki-') ? () => wiki(r.slice(5)) : r.startsWith('merch-') ? () => merchPage(r.slice(6)) : pages.inicio);
  $('#app').innerHTML = page();
  applyPrefs();
  if (r === 'buscar') { const q = $('#q'); if (q) q.focus(); }
  window.scrollTo(0, 0);
}
/* Pila de navegación interna: las flechas vuelven a la pantalla anterior real */
const stack = [location.hash.slice(1) || 'inicio'];
let replacing = false;
addEventListener('hashchange', () => {
  const r = location.hash.slice(1) || 'inicio';
  if (replacing) { stack[stack.length - 1] = r; replacing = false; }
  else if (stack.length > 1 && stack[stack.length - 2] === r) stack.pop();
  else if (stack[stack.length - 1] !== r) stack.push(r);
  render();
});
render();
Auth.init();

/* ===== 10. EVENTOS ===== */
/* Acciones de botones con data-act */
const acciones = {
  evento() {
    const n = $('#ev-n').value.trim(), m = $('#ev-m').value.trim();
    if (!n) return toast('Escribe el nombre del evento');
    const l = J.get('solicitudes', []);
    l.unshift({ evento: n, mensaje: m, fecha: new Date().toLocaleDateString('es'), estado: 'Pendiente' });
    J.set('solicitudes', l); toast('Solicitud enviada'); render();
  },
  canje() {
    const c = $('#cod').value.trim().toUpperCase(), l = J.get('multimedia', []);
    if (!c) return toast('Escribe un código');
    if (!codigosValidos[c]) return toast('Código no válido');
    if (l.some(x => x.codigo === c)) return toast('Ya canjeaste este código');
    l.unshift({ codigo: c, titulo: codigosValidos[c].titulo, fecha: new Date().toLocaleDateString('es') });
    J.set('multimedia', l); toast('¡Código canjeado!'); location.hash = '#multimedia';
  },
  tipo(t) { buscarTipo = t.dataset.tipo; document.querySelectorAll('.chip2').forEach(c => c.classList.toggle('on', c === t)); $('#res').innerHTML = resultados($('#q').value, buscarTipo); },
  leer(t) { const L = leidas(); if (!L.includes(t.dataset.id)) { L.push(t.dataset.id); J.set('avisos-leidos', L); } },
  leertodo() { J.set('avisos-leidos', avisos.map(n => n.id)); render(); },
  avtipo(t) { avisosTipo = t.dataset.tipo; document.querySelectorAll('.chip2').forEach(c => c.classList.toggle('on', c === t)); $('#av-lista').innerHTML = listaAvisos(avisosTipo); },
  deseo(t) { const p = productos.find(x => x.id === t.dataset.id); if (!p) return; let d = J.get('deseos', []); const ya = d.some(x => x.id === p.id); d = ya ? d.filter(x => x.id !== p.id) : [...d, p]; J.set('deseos', d); t.classList.toggle('on', !ya); toast(ya ? 'Quitado de tu lista de deseos' : 'Guardado en tu lista de deseos'); },
  sel(t) { let s = J.get('seleccion', []); s = s.includes(t.dataset.id) ? s.filter(i => i !== t.dataset.id) : [...s, t.dataset.id]; J.set('seleccion', s); },
  quitar(t) { J.set('deseos', J.get('deseos', []).filter(x => x.id !== t.dataset.id)); J.set('seleccion', J.get('seleccion', []).filter(i => i !== t.dataset.id)); render(); },
  paypal() { /* TODO: cuenta PayPal Business + backend que cree la orden de pago */ toast('Conecta aquí tu cuenta de PayPal Business para cobrar'); },
  /* Cerrar sesión: pide confirmación; “Sí” te manda al Login */
  salir() {
    const m = document.createElement('div'); m.id = 'modal';
    m.innerHTML = '<div class="mbox" role="alertdialog" aria-modal="true" aria-label="Cerrar sesión"><b>¿Seguro que quieres salir?</b><div><button class="btn2" data-act="salirsi">Sí</button><button class="btn3" data-act="salirno">No</button></div></div>';
    document.body.appendChild(m); m.querySelector('.btn3').focus();
  },
  salirno() { const m = $('#modal'); if (m) m.remove(); },
  async salirsi() { const m = $('#modal'); if (m) m.remove(); await Auth.signOut(); },
  unirse(t) { const s = t.dataset.slug; let m = J.get('comunidades', []); const ya = m.includes(s); m = ya ? m.filter(x => x !== s) : [...m, s]; J.set('comunidades', m); toast(ya ? 'Saliste de la comunidad' : '¡Te uniste a la comunidad!'); render(); },
  media() { const s = $('#sec-media'); if (s) s.scrollIntoView({ behavior: 'smooth' }); },
  rol() { toast('Los roles solo pueden asignarse por el equipo administrativo.'); },
  sstar(t) { let d = J.get('short-stars', []); const id = Number(t.dataset.id), ya = d.includes(id); d = ya ? d.filter(x => x !== id) : [...d, id]; J.set('short-stars', d); t.classList.toggle('on', !ya); t.querySelector('span').textContent = Number(t.dataset.n) + (ya ? 0 : 1); },
  sseguir(t) { t.textContent = t.textContent === 'Seguir' ? 'Siguiendo' : 'Seguir'; },
  sproximo() { toast('Próximamente'); },
  lupa() { const b = $('#sbx'); b.classList.toggle('on'); if (b.classList.contains('on')) $('#qs').focus(); },
  async copiar(t) { try { await navigator.clipboard.writeText(t.dataset.codigo); toast('Código copiado'); } catch (e) { toast(t.dataset.codigo); } }
};
/* Busca mientras escribes */
document.addEventListener('input', e => {
  if (e.target.id === 'q') $('#res').innerHTML = resultados(e.target.value, buscarTipo);
  if (e.target.id === 'qs') { const c = e.target.dataset.cat, q = e.target.value; $('#ps').innerHTML = (c.startsWith('merch-') && !q.trim()) ? merchBase : listaProductos(c, q); } /* búsqueda dentro de la tienda */
});
/* Guarda el idioma elegido en las listas desplegables */
document.addEventListener('change', e => { const s = e.target.closest('select[data-pref]'); if (s) store.set('gw-' + s.dataset.pref, s.value); });
document.addEventListener('submit', e => {
  const form=e.target.closest('[data-auth-form]'); if(!form)return; e.preventDefault();
  const mode=form.dataset.authForm;
  if(mode==='login') Auth.login(form); else if(mode==='registro') Auth.register(form); else if(mode==='recuperar') Auth.recover(form); else if(mode==='restablecer') Auth.updatePassword(form);
});
document.addEventListener('click', e => {
  const view=e.target.closest('[data-ga-view]');
  if(view){e.preventDefault();const welcome=$('#ga-welcome'),form=$('#ga-form');if(welcome)welcome.hidden=view.dataset.gaView!=='welcome';if(form)form.hidden=view.dataset.gaView!=='email';if(view.dataset.gaView==='email'){const input=$('#ga-login-email');if(input)input.focus();}return;}
  const route=e.target.closest('[data-ga-route]');
  if(route){e.preventDefault();location.hash='#'+route.dataset.gaRoute;return;}
});
document.addEventListener('click', e => {
  /* FAQ tipo acordeón: al abrir una pregunta se cierra la anterior; tocarla de nuevo la cierra */
  const sm = e.target.closest('.faq summary');
  if (sm) { document.querySelectorAll('.faq details').forEach(d => { if (d !== sm.parentElement) d.open = false; }); return; }
  const t = e.target.closest('[data-switch],[data-theme-opt],[data-auth],[data-up],[data-back],[data-replace],[data-act]');
  if (!t) return;
  if (t.dataset.act) { acciones[t.dataset.act](t); return; }
  /* Flecha: vuelve a la pantalla anterior; si no hay (entró directo), va al enlace de respaldo (href) */
  if (t.hasAttribute('data-back')) {
    e.preventDefault();
    if (stack.length > 1) { location.hash = stack[stack.length - 2]; return; }
    /* Sin historial interno (entró directo o recargó): sube a la pantalla “madre” y deja Inicio detrás, así la flecha nunca rebota */
    const fb = t.getAttribute('href').slice(1);
    stack.length = 0; stack.push(...(fb === 'inicio' ? ['inicio'] : ['inicio', fb]));
    location.hash = fb; return;
  }
  /* Pestañas hermanas (Siguiendo/Seguidores): reemplazan la entrada para que la flecha no dé vueltas */
  if (t.hasAttribute('data-replace')) { e.preventDefault(); replacing = true; location.replace(t.getAttribute('href')); return; }
  if (t.hasAttribute('data-switch')) { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); if (t.dataset.pref) store.set('gw-' + t.dataset.pref, t.getAttribute('aria-checked')); }
  else if (t.dataset.themeOpt) {
    themeMode = t.dataset.themeOpt; store.set('gw-theme', themeMode); applyTheme(themeMode);
    document.querySelectorAll('[data-theme-opt]').forEach(x => x.setAttribute('aria-checked', String(x === t)));
  } else if (t.dataset.auth) Auth.start(location.hash.slice(1), t.dataset.auth);
  else window.scrollTo({ top: 0, behavior: 'auto' }); /* sube de golpe */
});

/* Controles GEFFEN RADIO: el icono solo abre/cierra el panel; apagar está reservado a Ajustes. */
document.addEventListener('click', e => {
  const panelButton = e.target.closest('[data-radio-panel]');
  if (panelButton) {
    const panel = document.querySelector('[data-radio-panel-content]');
    if (panel) { panel.hidden = !panel.hidden; panelButton.setAttribute('aria-expanded', String(!panel.hidden)); }
    if (radioOn() && !radioLoaded) radioLoadCatalog();
    return;
  }
  if (e.target.closest('[data-radio-prev]')) { radioStep(-1); return; }
  if (e.target.closest('[data-radio-next]')) { radioStep(1); return; }
  if (e.target.closest('[data-radio-volume]')) {
    const panel = document.querySelector('[data-radio-volume-panel]');
    if (panel) panel.hidden = !panel.hidden;
  }
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-radio-volume-range]')) radioAudio.volume = Number(e.target.value) / 100;
});
/* El interruptor de radio de Ajustes es el único que puede desactivarla. */
document.addEventListener('click', e => {
  const toggle = e.target.closest('[data-switch][data-pref="radio"]');
  if (toggle) setTimeout(radioEnable, 0);
});
</script>
